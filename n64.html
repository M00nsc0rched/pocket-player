<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Player">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Pocket Player — N64</title>
<style>
  :root{ --gold:#d0a84e; --ink:#c9bfd6; --dim:#8a7f9e; --edge:#2a2140; --bad:#e07a90; }
  html,body{ margin:0; padding:0; height:100%; background:#000; overflow:hidden; position:fixed; inset:0;
    overscroll-behavior:none; touch-action:manipulation; -webkit-text-size-adjust:100%;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  /* the emulator fills the screen minus the notch / Dynamic Island / home-indicator
     areas, so the on-screen N64 buttons never sit under them */
  #wrap{ position:fixed; inset:0; box-sizing:border-box;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #game{ position:relative; width:100%; height:100%; }

  #pp-tap{ position:fixed; inset:0; z-index:2147483600; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; width:100%; margin:0; border:0; border-radius:0; padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top)); background:radial-gradient(circle at 50% 40%, #1a1328, #000 70%);
    color:var(--ink); font-family:Georgia,'Times New Roman',serif; cursor:pointer; text-align:center; }
  #pp-tap:disabled{ cursor:default; }
  #pp-tap > span{ display:block; }
  #pp-name{ color:var(--gold); font-size:22px; letter-spacing:2px; text-shadow:0 0 12px rgba(208,168,78,.3); max-width:90vw; }
  #pp-tap > #pp-play{ width:88px; height:88px; border-radius:50%; border:2px solid var(--gold); color:var(--gold);
    display:flex; align-items:center; justify-content:center; font-size:34px; padding-left:6px; box-sizing:border-box; }
  #pp-hint{ color:var(--dim); font-size:13px; letter-spacing:1px; }
  #pp-status{ color:var(--dim); font:12px/1.5 -apple-system,'Segoe UI',sans-serif; min-height:18px; max-width:90vw; white-space:pre-wrap; }
  #pp-status.bad{ color:var(--bad); }

  #pp-back{ position:fixed; z-index:2147483601; top:calc(6px + env(safe-area-inset-top)); left:50%; margin-left:-17px;
    width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.25); background:rgba(10,8,16,.45);
    color:rgba(255,255,255,.7); font-size:15px; line-height:32px; padding:0; text-align:center; cursor:pointer; }
  #pp-back:active{ background:rgba(208,168,78,.6); }

  #pp-toast{ position:fixed; z-index:2147483602; left:50%; top:calc(48px + env(safe-area-inset-top)); transform:translateX(-50%);
    max-width:86vw; padding:8px 14px; border-radius:16px; background:rgba(10,8,16,.85); border:1px solid var(--edge);
    color:var(--ink); font:13px/1.4 -apple-system,'Segoe UI',sans-serif; text-align:center; pointer-events:none;
    opacity:0; transition:opacity .25s; }
  #pp-toast.on{ opacity:1; }
</style>
</head>
<body>
<div id="wrap"><div id="game"></div></div>
<button id="pp-tap" type="button">
  <span id="pp-name">N64</span>
  <span id="pp-play">▶</span>
  <span id="pp-hint">Tap to start</span>
  <span id="pp-status"></span>
</button>
<button id="pp-back" type="button" title="Back to the library" aria-label="Back to the library">✕</button>
<div id="pp-toast"></div>
<script src="fflate.min.js"></script>
<script src="n64.js"></script>
</body>
</html>
